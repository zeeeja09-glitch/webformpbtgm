<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Ekstrakurikuler Sekolah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN COVER / LANDING PAGE -->
    <section id="coverPage" class="page-section active">
        <div class="cover-card">
            <span class="badge">Selamat Datang</span>
            <h1>Pendaftaran Ekstrakurikuler</h1>
            <p>Kembangkan minat, bakat, dan potensi diri Anda melalui berbagai pilihan ekstrakurikuler sekolah.</p>
            <button id="btnToForm" class="btn-primary">Menu Pendaftaran &rarr;</button>
        </div>
    </section>

    <!-- HALAMAN FORMULIR PENDAFTARAN -->
    <section id="formPage" class="page-section hidden">
        <div class="form-card">
            <button id="btnBackToCover" class="btn-back">&larr; Kembali ke Cover</button>
            <h2>Form Pendaftaran</h2>
            <p class="subtitle">Silakan isi formulir di bawah ini dengan benar.</p>

            <!-- Kotak Alert Status -->
            <div id="alertBox" class="alert hidden"></div>

            <form id="registrationForm" novalidate>
                <!-- Nama Lengkap -->
                <div class="form-group">
                    <label for="fullName">Nama Lengkap</label>
                    <input type="text" id="fullName" placeholder="Masukkan nama lengkap Anda">
                    <span class="error-text" id="fullNameError"></span>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="contoh@email.com">
                    <span class="error-text" id="emailError"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimal 8 karakter">
                    <span class="error-text" id="passwordError"></span>
                </div>

                <!-- Konfirmasi Password -->
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" placeholder="Ulangi password Anda">
                    <span class="error-text" id="confirmPasswordError"></span>
                </div>

                <!-- Pilihan Ekstrakurikuler (Sesuai Opsi yang Diminta) -->
                <div class="form-group">
                    <label for="extracurricular">Pilihan Ekstrakurikuler</label>
                    <select id="extracurricular">
                        <option value="volly" selected> Bola Voli</option>
                        <option value="osis/mPK"> osis</option>
                        <option value="futsal"> Futsal</option>
                        <option value="pramuka"> Pramuka</option>
                        <option value="musik"> Seni Musik</option>
                        <option value="paskibra">Paskibra</option>
                        <option value="jepang">Jepang</option>
                        <option value="jurnalistik">Jurnalistik</option>
                        <option value="pmr">PMR</option>
                        <option value="tari">Seni Tari</option>
                        <option value="silat">Silat</option>
                        <option value="fosster">Fosster</option>
                        <option value="rohis">Rohis</option>
                        <option value="mtq">MTQ</option>
                        <option value="mpk">MPK</option>
                    </select>
                    <span class="error-text" id="extracurricularError"></span>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="btn-submit">Daftar Sekarang</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
